<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一隅</title>
    <!-- Bootstrap CSS: -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    
    <link rel="stylesheet" href="./style.css">
    
    <!-- jQuery: -->
    <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>

</head>

<body>

    <!-- NavBar -->
    <nav class="navBar">
        <img src="./11uu.png" alt="logo圖" class="logo">
        <ul>
            <li>角落</li>
            <li><a href="#card_container" class="navbarLink">探索</a></li>
            <li>收藏</li>
        </ul>
    </nav>


    <!-- 主視覺 -->
    <section class="heroSec">
        <div class="hero_text">
            <!-- <h3>主題</h3> -->
            <p>偌大城市，有一隅為你而留。</p>
        </div>

    </section>


    <!-- 篩選區 -->
    <section class="select">
        <div id="selectedTags">今天想待的角落/想找什麼樣的角落：</div>
        <hr>
        <div id="tagPool">
            <button class="tag_button">&nbsp;#標籤1&nbsp;</button>
            <button class="tag_button">&nbsp;#標籤2&nbsp;</button>
            <button class="tag_button">&nbsp;#標籤3&nbsp;</button>
            <button class="tag_button">&nbsp;#標籤4&nbsp;</button>
            <button class="tag_button">&nbsp;#標籤5&nbsp;</button>
            <button class="tag_button">&nbsp;#標籤6&nbsp;</button>
            <button class="tag_button">&nbsp;#標籤7&nbsp;</button>
            <button class="tag_button">&nbsp;#標籤8&nbsp;</button>
        </div>
        <br>
        <button id="searchButton">開始探索</button>
    </section>

    
    <!-- 所有咖啡廳 -->
    <section class="card_sec" id="card_container"></section>

    <!-- Modal互動視窗 -->
    <div class="modal fade" id="cafe_modal">

        <div class="modal-dialog modal-dialog-centered modal-xl">

            <div class="modal-content d-flex flex-row p-5">
                <!-- 左：圖片 -->
                <div class="modal-left w-50 p-5">
                    <!-- <img src="./modal_img1.jpg"> -->
                    <img id="modalImg">
                </div>
                <!-- 右：關閉按鈕+文字內容 -->
                <div class="modal-right w-50 p-5">
                    <button type="button" class="btn-close" data-bs-dismiss="modal">&times;</button>
                    <div class="w-100 h-100" id="modalText">
                        <!-- <h4>店名</h4>
                        <p>一句介紹</p>
                        <div>所有標籤</div>
                        <p>推薦給...</p>
                        <p>地區</p>
                        <a href="https://maps.app.goo.gl/Xir8xgHPArYdqdKg9" target="_blank" rel="noopener noreferrer">前往角落</a> -->
                    </div>
                </div>

            </div>

        </div>

    </div>


    <!-- 關於網站 -->
    <section>
        <div>About us</div>
        <p>想說的話</p>
    </section>


    <!-- 頁尾 -->
    <div class="footer">聯絡我們</div>


    <script src="./data.js"></script>
    <script>

        $(document).ready(function () { 

            
            // 點擊標籤按鈕
            $(".tag_button").on("click",function () {
                var thisTag = $(this).text();

                var select_title = $("#selectedTags").text();
                
                if (select_title.includes(thisTag)) {
                    select_title = select_title.replace(thisTag, "");
                    // console.log(`if stituation, select_title = ${select_title}`);
                                        
                } else {
                    select_title = select_title + thisTag;
                    // console.log(`else stituation, select_title = ${select_title}`);
                }
                $("#selectedTags").text(select_title);
                // $("#selectedTags").append(thisTag);                                
            })


            // 顯示所有咖啡廳
            var temp = "";
            for (var i = 0; i < cafeList.length; i++) {
                
                var this_cafe = cafeList[i];
                // var cafeId = `cafe_${i+1}`;
                
                temp += `
                <div class="cafe_card">
                    <img src=${this_cafe.pic}>
                    <div class="cafe_info">
                        <h5>${this_cafe.name}</h5>
                        <p>${this_cafe.highlight}</p>
                        <span>${this_cafe.tag}</span>                
                        <p>${this_cafe.dist}</p>
                    </div>
                </div>
                ` 
            }               
            document.getElementById("card_container").innerHTML = temp;
            // end --顯示所有咖啡廳      
            
            
            
            // 點卡片顯示modal
            $(".cafe_card").on("click", function () {
                var choosen_index = $(this).index();
                var choosen_card = cafeList[choosen_index];
                console.log(choosen_card);

                document.getElementById("modalImg").src = choosen_card.pic;
                var text_temp = `
                        <h4>${choosen_card.name}</h4>
                        <p>${choosen_card.highlight}</p>
                        <div>${choosen_card.tag}</div>
                        <br>
                        <p>推薦給...</p>
                        <p>${choosen_card.dist}</p>
                        <a href=${choosen_card.map} target="_blank" rel="noopener noreferrer">前往角落</a>
                `;
                document.getElementById("modalText").innerHTML = text_temp;
                
                var modalElement = document.getElementById("cafe_modal");
                var modal = new bootstrap.Modal(modalElement);
                modal.show();                     
            })
            
        })



    </script>



    <!-- Bootstrap JS:-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>

</html>
